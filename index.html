<!DOCTYPE html>
<html>

<head>
	<title>Animated Triangulated Image</title>
	<style>
		.samebase-attribution {
			align-items: center;
			color: #737373;
			display: flex;
			font: 12px system-ui, sans-serif;
			margin: auto 10px 0 auto;
			min-height: 44px;
			text-decoration: none;
			width: max-content;
		}

		.samebase-attribution svg {
			display: inline-block;
			height: 0.75em;
			margin-right: 0.15em;
			shape-rendering: crispEdges;
			vertical-align: baseline;
			width: 0.75em;
		}

		.samebase-attribution span { border-bottom: 1px solid transparent; white-space: nowrap; }

		.samebase-attribution:hover span { border-bottom-color: currentColor; }

		.samebase-attribution:focus-visible {
			outline: 2px solid currentColor;
			outline-offset: 2px;
		}

		#canvas {
			display: block;
		}
	</style>
</head>

<body style="display: flex; flex-direction: column; align-items: flex-start; min-height: calc(100vh - 8px);">
	<label> Write something:</label>
	<input style="display:block" type="text" oninput="changeText(this.value)">

	<canvas id="back" style="display: none">

	</canvas>

	<canvas id="canvas">

	</canvas>

	<img src="./img.jpg" id="img.jpg" style="display: none">

	<a class="samebase-attribution" href="https://samebase.com" target="_blank" rel="noopener noreferrer"
		aria-label="Managed with Samebase"><span>Managed with <b><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" aria-hidden="true">
				<path d="M0 0h60v60H0z M20 20h20v20H20z" fill="currentColor" fill-rule="evenodd" />
			</svg>Samebase</b></span>
	</a>

	<script src="./dist.js">
	</script>

</body>

</html>
